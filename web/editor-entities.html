<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>臥龍傳 — 來源檢查</title>
<style>body{font:16px sans-serif;margin:24px;background:#f4eddb;color:#24291d}label,button,a{margin:6px}select,input{font:inherit;max-width:85vw}#status{white-space:pre-wrap}main{display:flex;gap:20px;flex-wrap:wrap}.list{max-height:55vh;overflow:auto;flex:1;min-width:320px}table{border-collapse:collapse;width:100%}th{position:sticky;top:0;background:#e8dfc8}td,th{text-align:left;padding:6px;border-bottom:1px solid #baae90}tr.selected{background:#4a7828;color:white}tr[data-slot]{cursor:pointer}#detail{flex:1;min-width:320px;overflow-wrap:anywhere}#bytes{display:grid;grid-template-columns:repeat(8,minmax(36px,1fr));gap:4px}#bytes span{font:13px monospace;background:#e1dac6;padding:5px}#bytes .unknown{background:#ebc48e}pre{white-space:pre-wrap;overflow-wrap:anywhere}.notice{border-left:4px solid #a07e28;padding-left:12px}button{font:inherit}</style></head><body>
<h1>人物／章節來源檢查（唯讀）</h1><p class="notice">來源實例不等於不同歷史人物；同名／同槽／同頭像不自動歸併。本頁沒有編輯、任免、初始化或存檔功能。</p>
<a href="/">返回本地遊戲管理</a><button id="reload">重新載入固定草稿修訂</button><p id="identity"></p><p id="status" role="status"></p>
<label>章節 <select id="chapter"></select></label><label>搜尋姓名／來源ID／槽 <input id="search" type="search"></label><p id="dates"></p><p id="warnings"></p>
<main><section class="list"><table><thead><tr><th>原槽</th><th>模板顯示姓名</th><th>來源角色</th></tr></thead><tbody id="records"></tbody></table></section><section id="detail"><h2 id="record-name">選擇來源記錄</h2><pre id="record-info"></pre><div id="bytes"></div><p>橙色：本輪未閉合的G14／G15／G1B，完整原字節保留，不補值。</p><h3>已列原始引用</h3><ul id="references"></ul><p id="limits"></p></section></main>
<script type="module" src="/src/editor/entities.js"></script></body></html>

<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <title>臥龍傳 · Web</title>
    <style>
      /* 表格数字字体 (原版风格替代): Oswald */
      @font-face {
        font-family: "Oswald";
        src: url("font/Oswald-Light.woff2") format("woff2");
        font-weight: 300;
        font-display: block;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #141414;
        overflow: hidden;
        font-family: "Noto Serif TC", "PMingLiU", serif;
      }
      #cv {
        display: block;
        width: 100vw;
        height: 100vh;
        cursor: grab;
      }
      .panel {
        position: fixed;
        background: rgba(20, 15, 10, 0.88);
        border: 1px solid #6b5335;
        border-radius: 6px;
        color: #e8d9b0;
        user-select: none;
      }
      #panel {
        top: 12px;
        left: 12px;
        padding: 10px 14px;
        font-size: 14px;
      }
      .tab {
        display: inline-block;
        margin: 2px;
        padding: 3px 10px;
        border: 1px solid #6b5335;
        border-radius: 4px;
        cursor: pointer;
      }
      .tab.on {
        background: #8a6d3b;
        color: #fff;
      }
      #tip {
        position: fixed;
        display: none;
        background: rgba(20, 15, 10, 0.95);
        color: #f0e6c8;
        border: 1px solid #6b5335;
        border-radius: 6px;
        padding: 8px 12px;
        font-size: 13px;
        pointer-events: none;
        line-height: 1.7;
        z-index: 9;
      }
      #legend {
        right: 12px;
        top: 12px;
        padding: 8px 12px;
        font-size: 13px;
        line-height: 1.9;
        max-height: 80vh;
        overflow-y: auto;
      }
      .frow {
        cursor: pointer;
      }
      .frow:hover {
        background: #3a2e1c;
        border-radius: 3px;
      }
      .dim {
        color: #8a7a55;
      }
      #card {
        left: 12px;
        bottom: 12px;
        padding: 10px;
        display: none;
        gap: 10px;
        align-items: center;
        font-size: 14px;
        line-height: 1.8;
      }
      #settlelog {
        color: #8fb86b;
        margin-left: 10px;
        font-size: 12px;
      }
      #card img {
        width: 128px;
        height: 128px;
        image-rendering: pixelated;
        border: 1px solid #6b5335;
        border-radius: 4px;
      }
      #cmdpanel {
        left: 50%;
        transform: translateX(-50%);
        bottom: 12px;
        padding: 10px 14px;
        font-size: 14px;
        line-height: 1.8;
        display: none;
      }
      #savedlg {
        left: 50%;
        transform: translateX(-50%);
        bottom: 60px;
        padding: 12px 16px;
        font-size: 14px;
        z-index: 15;
      }
      #savedlg .slot {
        display: block;
        width: 100%;
        text-align: left;
        margin: 3px 0;
        cursor: pointer;
      }
      #flashlog {
        position: fixed;
        right: 12px;
        bottom: 12px;
        font-size: 13px;
        color: #e8d9b0;
        pointer-events: none;
        text-align: right;
        z-index: 9;
      }
      #flashlog div {
        background: rgba(20, 15, 10, 0.85);
        border: 1px solid #6b5335;
        border-radius: 4px;
        padding: 2px 8px;
        margin-top: 4px;
      }
      #bctl button {
        min-height: 25px;
        border: 1px solid #8d6b14;
        background: #eee;
        color: #111;
        font-family: inherit;
        white-space: pre-line;
        cursor: pointer;
      }
      #bctl button.selected {
        background: #4a7828;
        color: #fff6b0;
        box-shadow: inset 0 0 0 1px #e3bd3a;
      }
      #bunits button[data-unit-type="cavalry"] {
        border-color: #d7a850;
      }
      #bunits button[data-unit-type="infantry"] {
        border-color: #78ad68;
      }
      #bunits button[data-unit-type="archer"] {
        border-color: #72a7d7;
      }
      #bctl button:disabled {
        background: #555;
        color: #888;
        cursor: default;
      }
    </style>
  </head>
  <body>
    <canvas id="cv"></canvas>
    <!-- 旧开发用 UI 已由原版风格 GameBar (canvas 内绘制) 取代, 保留 DOM 供对话框复用 -->
    <div id="panel" class="panel" style="display: none">
      <div style="margin-bottom: 6px">
        臥龍傳 — 全劇本全國地圖（原始地形 + SINARIO.DAT 勢力數據）
      </div>
      <div id="tabs"></div>
      <div>季節 <span id="seasons"></span></div>
      <div id="clockbar" style="margin-top: 6px"></div>
      <div id="info" style="margin-top: 4px; color: #b8a67a"></div>
    </div>
    <div id="legend" class="panel" style="display: none"></div>
    <div id="cmdpanel" class="panel"></div>
    <div
      id="endv"
      style="
        position: fixed;
        inset: 0;
        z-index: 40;
        display: none;
        background: #000;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        cursor: pointer;
      "
    >
      <img
        id="edimg"
        class="pixelated"
        alt=""
        style="
          max-width: 96vw;
          max-height: 88vh;
          image-rendering: pixelated;
          opacity: 0;
        "
      />
      <div
        id="edcap"
        style="
          color: #ffd700;
          margin-top: 10px;
          font-size: 15px;
          letter-spacing: 2px;
        "
      ></div>
    </div>
    <canvas
      id="startv"
      width="640"
      height="400"
      style="
        position: fixed;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        z-index: 60;
        display: none;
        cursor: pointer;
      "
    ></canvas>
    <div
      id="openv"
      style="
        position: fixed;
        inset: 0;
        z-index: 48;
        display: none;
        background: #000;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        cursor: pointer;
      "
    >
      <img
        id="opimg"
        class="pixelated"
        alt=""
        style="
          max-width: 96vw;
          max-height: 88vh;
          image-rendering: pixelated;
          opacity: 0;
        "
      />
      <div
        id="opcap"
        style="
          color: #b8a67a;
          margin-top: 10px;
          font-size: 13px;
          letter-spacing: 2px;
        "
      >
        點擊跳過
      </div>
    </div>
    <div id="savedlg" class="panel" style="display: none">
      <div style="margin-bottom: 8px">存入本機存檔槽</div>
      <div id="saveslots"></div>
      <button id="savecancel">取消</button>
    </div>
    <div id="tip"></div>
    <canvas
      id="bcv"
      style="
        position: fixed;
        inset: 0;
        z-index: 30;
        display: none;
        cursor: crosshair;
      "
    ></canvas>
    <div
      id="bctl"
      style="
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        width: 144px;
        box-sizing: border-box;
        padding: 4px;
        background: #050505;
        border-left: 4px double #d6a61f;
        color: #f1df8a;
        font-size: 12px;
        line-height: 1.35;
        z-index: 31;
        display: none;
        user-select: none;
      "
    >
      <!-- 完整战场模式不再绘制小地图；双方战中发言固定显示在带头像的双通话框。 -->
      <div
        id="bdialogue-atk"
        style="
          display: grid;
          grid-template-columns: 48px 1fr;
          min-height: 70px;
          border: 2px solid #b8860b;
          padding: 3px;
          background: #080808;
        "
      >
        <img
          id="bdialogue-atk-face"
          alt=""
          style="
            width: 48px;
            height: 64px;
            object-fit: cover;
            image-rendering: pixelated;
          "
        />
        <div style="min-width: 0; padding-left: 4px">
          <div id="bdialogue-atk-name" style="color: #8fb8ff">攻方</div>
          <div id="bdialogue-atk-text" style="color: #fff; white-space: normal">
            －－－
          </div>
        </div>
      </div>
      <div
        id="bdialogue-def"
        style="
          display: grid;
          grid-template-columns: 48px 1fr;
          min-height: 70px;
          margin-top: 4px;
          border: 2px solid #b8860b;
          padding: 3px;
          background: #080808;
        "
      >
        <img
          id="bdialogue-def-face"
          alt=""
          style="
            width: 48px;
            height: 64px;
            object-fit: cover;
            image-rendering: pixelated;
          "
        />
        <div style="min-width: 0; padding-left: 4px">
          <div id="bdialogue-def-name" style="color: #ff8d78">守方</div>
          <div id="bdialogue-def-text" style="color: #fff; white-space: normal">
            －－－
          </div>
        </div>
      </div>
      <div
        style="
          margin-top: 6px;
          border: 2px solid #b8860b;
          padding: 4px;
          background: #080808;
        "
      >
        <div id="btitle" style="color: #ffd700; text-align: center"></div>
        <div
          style="
            margin-top: 4px;
            border-top: 1px solid #705810;
            padding-top: 4px;
          "
        >
          <div id="batkname" style="color: #8fb8ff"></div>
          <div>
            兵力 <span id="batktroops">0</span>　士氣
            <span id="batkmorale">0</span>
          </div>
        </div>
        <div
          style="
            margin-top: 4px;
            border-top: 1px solid #705810;
            padding-top: 4px;
          "
        >
          <div id="bdefname" style="color: #ff8d78"></div>
          <div>
            兵力 <span id="bdeftroops">0</span>　士氣
            <span id="bdefmorale">0</span>
          </div>
        </div>
      </div>
      <div
        style="
          margin-top: 6px;
          border: 2px solid #b8860b;
          padding: 4px;
          background: #080808;
        "
      >
        <div style="color: #ffd700; text-align: center">部隊選擇</div>
        <div
          id="bunits"
          style="
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 3px;
            margin-top: 4px;
          "
        >
          <button id="bunit0" type="button">一</button>
          <button id="bunit1" type="button">二</button>
          <button id="bunit2" type="button">三</button>
          <button id="bunit3" type="button">四</button>
          <button id="bunit4" type="button">五</button>
          <button id="bunit5" type="button">六</button>
        </div>
        <div
          style="
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px;
            margin-top: 6px;
          "
        >
          <button id="bassault" type="button">突擊</button>
          <button id="bsiege" type="button">攻城</button>
          <button id="bformation" type="button">陣形</button>
          <button id="bwall" type="button">城壁</button>
          <button id="bdefend" type="button">守陣</button>
          <button id="bretreat" type="button">退卻</button>
        </div>
        <div
          id="bcommandhint"
          style="min-height: 34px; margin-top: 6px; color: #cbb968"
        >
          選擇部隊後下達命令。
        </div>
      </div>
    </div>
    <div id="card" class="panel"></div>
    <script type="module" src="src/boot.js"></script>
  </body>
</html>
